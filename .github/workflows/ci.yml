# Builds skywire and runs ctest on Linux, macOS and Windows.
#
# linux-all-languages, macos and windows have every language toolchain and
# fail if ctest skips anything, so a broken toolchain setup can't pass
# quietly. linux-sanitize runs whatever the runner image has and allows skips.
#
# Third-party actions are pinned by commit; the comment gives the release.

name: CI

# Pull requests run CI; a squash merge puts the tested change on master, so
# master runs it again only when the vcpkg setup changes. That run saves the
# Windows vcpkg cache under master, the only branch whose caches every pull
# request can restore. Run it by hand (workflow_dispatch) at any other time.
on:
  push:
    branches: [master]
    paths:
      - .github/actions/setup-vcpkg/**
      - .github/vcpkg/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  APT_PACKAGES: >-
    libprotobuf-dev protobuf-compiler
    libgtest-dev libgmock-dev
    libprotozero-dev
    ninja-build pkg-config

jobs:
  linux-all-languages:
    name: Linux (GCC, all languages)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Swift, Rust and Python come with the runner image.
      - name: Check toolchains
        run: |
          rustup component add rustfmt clippy
          swiftc --version
          go version
          javac -version
          python3 --version
          rustc --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPROTOZERO_DIR=/usr
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          SKYWIRE_RING_REQUIRE_ALL: '1'
        run: ctest --test-dir build -j4 --output-on-failure --output-junit ctest.xml
      - name: No test skipped
        if: success() || failure()
        run: python3 scripts/check_ctest_skips.py build/ctest.xml

  linux-sanitize:
    name: Linux (Clang, ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES clang
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSKYWIRE_SANITIZE=ON
          -DPROTOZERO_DIR=/usr
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build -j4 --output-on-failure

  macos:
    name: macOS (Apple Clang)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install protobuf googletest protozero ninja
      # The image has Java, Python, Rust and Swift but not Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          -DPROTOZERO_DIR="$(brew --prefix protozero)"
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          SKYWIRE_RING_REQUIRE_ALL: '1'
        run: ctest --test-dir build -j4 --output-on-failure --output-junit ctest.xml
      - name: No test skipped
        if: success() || failure()
        run: python3 scripts/check_ctest_skips.py build/ctest.xml

  windows:
    name: Windows (MSVC, VS 2026)
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # The image has Go, Java, Python and Rust but not Swift.
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE

      - uses: ./.github/actions/setup-vcpkg
        id: vcpkg
        with:
          cache-name: windows-x64

      - name: Configure, build and test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $env:VCPKG_ROOT = $env:SKYWIRE_VCPKG
          cl 2>&1 | Select-Object -First 1
          swiftc --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:SKYWIRE_VCPKG\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            "-DVCPKG_MANIFEST_DIR=$env:GITHUB_WORKSPACE\.github\vcpkg" `
            -DVCPKG_MANIFEST_FEATURES=tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:SKYWIRE_RING_REQUIRE_ALL = '1'
          ctest --test-dir build -j4 --output-on-failure --output-junit ctest.xml
          exit $LASTEXITCODE

      - name: No test skipped
        if: success() || failure()
        run: python scripts/check_ctest_skips.py build/ctest.xml

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.vcpkg.outputs.cache-hit != 'true'
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.cache-key }}

  format:
    name: clang-format (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: pip install --user clang-format==19.1.7
      - name: Check changed lines
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          out=$(git clang-format --diff "$(git merge-base "$BASE" HEAD)" -- '*.c' '*.cpp' '*.h')
          if grep -q '^diff --git' <<<"$out"; then
            printf '%s\n' "$out"
            echo "::error::Changed lines are not clang-formatted. Run: git clang-format $BASE"
            exit 1
          fi
          echo "$out"

# Builds skywire and runs ctest on Linux, macOS and Windows.
#
# linux-all-languages, macos and windows have every language toolchain and
# fail if ctest skips anything, so a broken toolchain setup can't pass
# quietly; the JSON Schema check (skywire_schema:Check) runs on Linux only,
# since it doesn't depend on the platform. linux-sanitize runs whatever the
# runner image has and allows skips. coverage reports test coverage
# (scripts/coverage.py) and never fails on it. docs builds the documentation
# site and fails on any warning, such as a broken link.
#
# Third-party actions are pinned by commit; the comment gives the release.

name: CI

# To keep Actions minutes down, CI runs only when a release is cut: the
# Release workflow calls it (workflow_call) for each v* tag and holds back
# publishing unless it passes. Pull requests and pushes run nothing; run it by
# hand (Actions > CI > Run workflow, or gh workflow run ci.yml --ref <branch>)
# to test a branch. Check formatting locally: git clang-format origin/master.
#
# No concurrency group: a called workflow's would be the caller's, and wait on
# it forever.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  APT_PACKAGES: >-
    libprotobuf-dev protobuf-compiler
    libgtest-dev libgmock-dev
    libprotozero-dev
    ninja-build pkg-config
  # The JavaScriptTypes test checks the generated .d.ts files with this tsc;
  # keep it the same as on the dev hosts.
  TYPESCRIPT_VERSION: '5.9.3'

jobs:
  linux-all-languages:
    name: Linux (GCC, all languages)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES python3-jsonschema

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # Swift, Rust, Python, .NET and Node come with the runner image.
      - name: Check toolchains
        run: |
          rustup component add rustfmt clippy
          npm install -g "typescript@$TYPESCRIPT_VERSION"
          swiftc --version
          go version
          javac -version
          python3 --version
          rustc --version
          dotnet --version
          node --version
          tsc --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPROTOZERO_DIR=/usr
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          SKYWIRE_RING_REQUIRE_ALL: '1'
        run: ctest --test-dir build -j4 --output-on-failure --output-junit ctest.xml
      - name: No test skipped
        if: success() || failure()
        run: python3 scripts/check_ctest_skips.py build/ctest.xml

  linux-sanitize:
    name: Linux (Clang, ASan + UBSan)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES clang
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSKYWIRE_SANITIZE=ON
          -DPROTOZERO_DIR=/usr
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build -j4 --output-on-failure

  # Line and branch coverage of wiregen and the C/C++ runtimes, from a GCC
  # Debug build with every language toolchain (the round trips run each
  # generator). Report only: the HTML and Cobertura XML are uploaded as the
  # "coverage" artifact and the totals go in the job summary.
  coverage:
    name: Linux (GCC, coverage)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $APT_PACKAGES gcovr
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Check toolchains
        run: |
          rustup component add rustfmt clippy
          node --version
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSKYWIRE_COVERAGE=ON
          -DPROTOZERO_DIR=/usr
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build -j4 --output-on-failure
      - name: Report
        # A reporting problem must not hold back a release.
        continue-on-error: true
        run: |
          mkdir -p coverage
          python3 scripts/coverage.py build --html coverage/index.html --xml coverage/coverage.xml | tee coverage/summary.txt
          { echo '```'; tail -n 3 coverage/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() || failure()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  macos:
    name: macOS (Apple Clang)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install protobuf googletest protozero ninja
      # The image has Java, Python, Rust, Swift, .NET and Node but not Go.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: Check toolchains
        run: |
          npm install -g "typescript@$TYPESCRIPT_VERSION"
          dotnet --version
          node --version
          tsc --version
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$(brew --prefix)"
          -DPROTOZERO_DIR="$(brew --prefix protozero)"
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          SKYWIRE_RING_REQUIRE_ALL: '1'
        run: ctest --test-dir build -j4 --output-on-failure --output-junit ctest.xml
      - name: No test skipped
        if: success() || failure()
        run: python3 scripts/check_ctest_skips.py build/ctest.xml --allow '^skywire_schema:'

  windows:
    name: Windows (MSVC, VS 2026)
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # The image has Go, Java, Python, Rust, .NET and Node but not Swift.
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f # v0.5.1
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE

      - uses: ./.github/actions/setup-vcpkg
        id: vcpkg
        with:
          cache-name: windows-x64

      - name: Configure, build and test
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vs\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vs -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          $env:VCPKG_ROOT = $env:SKYWIRE_VCPKG
          cl 2>&1 | Select-Object -First 1
          swiftc --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm install -g "typescript@$env:TYPESCRIPT_VERSION"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          tsc --version
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:SKYWIRE_VCPKG\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            "-DVCPKG_MANIFEST_DIR=$env:GITHUB_WORKSPACE\.github\vcpkg" `
            -DVCPKG_MANIFEST_FEATURES=tests
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:SKYWIRE_RING_REQUIRE_ALL = '1'
          ctest --test-dir build -j4 --output-on-failure --output-junit ctest.xml
          exit $LASTEXITCODE

      - name: No test skipped
        if: success() || failure()
        run: python scripts/check_ctest_skips.py build/ctest.xml --allow '^skywire_schema:'

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: always() && steps.vcpkg.outputs.cache-hit != 'true'
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg.outputs.cache-key }}

  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the site
        env:
          NO_MKDOCS_2_WARNING: '1'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r docs/requirements.txt
          .venv/bin/mkdocs build --strict
